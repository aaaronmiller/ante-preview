[package]
name = "ante-acp"
version = "0.1.0"
edition = "2024"
description = "Agent Client Protocol support for Ante"
license = "Apache-2.0"
documentation = "https://docs.rs/ante-acp"
homepage = "https://antigma.ai"
repository = "https://github.com/AntigmaLabs/ante"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "time"] }
ante-sdk = { path = "../crates/ante-sdk" }

[dev-dependencies]
tempfile = "3"
